<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Звонок</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#151b1c;color:#e8f0ee;font:20px/1.4 system-ui,sans-serif;text-align:center}
#n{font-size:26px;font-weight:700;margin-bottom:18px}
a{display:inline-block;padding:16px 34px;border-radius:16px;background:#3fb67a;color:#08150e;text-decoration:none;font-weight:700}
p{font-size:15px;color:#9db0ac;max-width:300px;margin:16px auto 0}</style></head>
<body><div><div id="n"></div><a id="c" href="#">Позвонить</a>
<p>Если звонок не начался сам, нажмите кнопку.</p></div>
<script>
var n=decodeURIComponent(location.hash.slice(1)).replace(/[^+\d]/g,'');
var a=document.getElementById('c');
if(n.length<5){document.getElementById('n').textContent='Номер не указан';a.style.display='none'}
else{document.getElementById('n').textContent=n;a.href='tel:'+n;setTimeout(function(){location.href='tel:'+n},300)}
</script></body></html>
